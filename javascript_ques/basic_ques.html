<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        console.log("Armstrong numbers between 100 and 999:");
        for (let i = 100; i <= 999; i++) {
            let temp = i;
            let s = 0;
            while (temp > 0) {
                let d = temp % 10;
                s = s + d * d * d;
                temp = Math.floor(temp / 10);
            }
            if (s === i) {
                console.log(i);
            }
        }

        

        console.log("Multiplication Table");
        for (let i = 1; i <= 5; i++) {
            console.log("Multiplication Table of " + i);
            for (let j = 1; j <= 10; j++) {
                console.log(i + " x " + j + " = " + (i * j));
            }
            console.log("----------------");
        }



        console.log("Prime numbers between 1 and 100:");
        for (let num = 2; num <= 100; num++) {
            let isPrime = true;
            for (let i = 2; i < num; i++) {
                if (num % i === 0) {
                    isPrime = false;
                    break;
                }
            }
            if (isPrime) {
                console.log(num);
            }
        }



        console.log("Print each character of a string using for loop:");
        let str = prompt("Enter input:");
        for (let i = 0; i < str.length; i++) {
            console.log(str[i]);
        }



        console.log("Check if a number is a palindrome:");
        let num = 12321;
        let original = num;
        let reverse = 0;
        while (num > 0) {
            let digit = num % 10;
            reverse = reverse * 10 + digit;
            num = Math.floor(num / 10);
        }
        if (original === reverse) {
            console.log(original + " is a palindrome.");
        } else {
            console.log(original + " is not a palindrome.");
        }



        console.log("Print numbers from 1 to 100 using do-while loop:");
        let nums = 5;
        let sum = 0;
        do {
            console.log(nums);
            sum = sum + nums;
            nums = nums + 5;
        }
        while (nums <= 100);
        console.log("Sum of the sequence:", sum);



        console.log("Sum of even and odd digits in a number:");
        let n = 58376462;
        let evenSum = 0;
        let oddSum = 0;
        while (n > 0) {
            let digit = n % 10;
            if (digit % 2 === 0) {
                evenSum = evenSum + digit;
            } else {
                oddSum = oddSum + digit;
            }
            n = Math.floor(n / 10);
        }
        console.log("Sum of even digits:", evenSum);
        console.log("Sum of odd digits:", oddSum);



        console.log("Sum of positive, negative numbers and count of zeros in an array:");
        let arr = [10, -5, 20, 0, -8, 15, 0, -2];
        let positiveSum = 0;
        let negativeSum = 0;
        let zeroCount = 0;
        for (let i = 0; i < arr.length; i++) {
            if (arr[i] > 0) {
                positiveSum = positiveSum + arr[i];
            } else if (arr[i] < 0) {
                negativeSum = negativeSum + arr[i];
            } else {
                zeroCount++;
            }
        }
        console.log("Sum of positive numbers:", positiveSum);
        console.log("Sum of negative numbers:", negativeSum);
        console.log("Number of zeros:", zeroCount);



        console.log("Electricity bill calculation based on category and units consumed:");
        let category = "domestic";
        let units = 100;
        let rate;
        let bill;
        switch (category.toLowerCase()) {
            case "domestic":
                rate = 5;
                break;
            case "commercial":
                rate = 2;
                break;
            case "industry":
                rate = 10;
                break;
            default:
                console.log("Invalid category");
                break;
        }
        if (
            category.toLowerCase() === "domestic" ||
            category.toLowerCase() === "commercial" ||
            category.toLowerCase() === "industry"
        ) {
            bill = units * rate;
            console.log("Category:", category);
            console.log("Units consumed:", units);
            console.log("Rate per unit: Rs.", rate);
            console.log("Electricity bill: Rs.", bill);
        }


    </script>
</body>

</html>
